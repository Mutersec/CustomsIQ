# Local development only — not used by the live Render deploy (see the
# README's "🐳 Running with Docker" section).
#
# No hot-reload / source volume mount: "docker compose up for local dev"
# means "runs locally via compose," not "watches for file changes" — a
# deliberate simplification, not an oversight. Rebuild after code changes.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Same keys as .env.example, wired through the existing pydantic-settings
      # config (src/customsiq/config.py) — no new settings invented here.
      CUSTOMSIQ_DATABASE_PATH: /data/customsiq.db
      CUSTOMSIQ_LOG_LEVEL: INFO
      CUSTOMSIQ_SCREENING_THRESHOLD: "0.75"
      CUSTOMSIQ_PASSWORD_ITERATIONS: "600000"
      CUSTOMSIQ_SESSION_TTL_HOURS: "12"
      # Demo accounts (one per role, credentials in the README) are seeded only
      # into an empty users table. Set to "false" for a real deployment.
      CUSTOMSIQ_SEED_DEMO_USERS: "true"
      # Empty by default => SQLite, exactly as before. Set it to opt into the
      # postgres service below (which also needs --profile postgres):
      #   CUSTOMSIQ_DATABASE_URL=postgresql://customsiq:customsiq@postgres:5432/customsiq \
      #     docker compose --profile postgres up
      CUSTOMSIQ_DATABASE_URL: ${CUSTOMSIQ_DATABASE_URL:-}
    volumes:
      # Named volume so the seeded database survives `docker compose down`/`up`
      # instead of resetting every time.
      - customsiq-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        # Not required: without --profile postgres the service isn't started at
        # all, and the app falls back to SQLite rather than failing to boot.
        required: false

  # Opt-in alternative backend: only started with `--profile postgres`, so a
  # plain `docker compose up` stays on SQLite exactly as before.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: customsiq
      POSTGRES_USER: customsiq
      POSTGRES_PASSWORD: customsiq
      # C collation keeps ORDER BY on the ISO-8601 timestamp strings byte-exact,
      # matching SQLite's binary comparison instead of a locale's rules.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - customsiq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customsiq -d customsiq"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  customsiq-data:
  customsiq-postgres-data:
