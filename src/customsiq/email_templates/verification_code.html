<!DOCTYPE html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>$subject</title>
<style>
  /* Progressive enhancement only: every style that matters is inline, so a
     client that strips this block (the Gmail app does) still gets the design. */
  @media only screen and (max-width: 520px) {
    .outer { padding: 16px 8px !important; }
    .card-body { padding: 24px 20px !important; }
    .code { font-size: 30px !important; letter-spacing: 6px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f3f5f8;-webkit-text-size-adjust:100%;">
  <!-- Preheader: the line inbox lists show next to the subject. -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">$preheader</div>

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f3f5f8;">
    <tr>
      <td class="outer" align="center" style="padding:32px 16px;">

        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;background-color:#ffffff;border:1px solid #e1e6ee;border-radius:14px;overflow:hidden;">
          <!-- Brand band -->
          <tr>
            <td style="background-color:#0b2545;padding:20px 28px;border-bottom:3px solid #c9a227;">
              <span style="font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:0.3px;">Customs<span style="color:#c9a227;">IQ</span></span>
            </td>
          </tr>

          <tr>
            <td class="card-body" style="padding:32px 28px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f1b2d;">
              <h1 style="margin:0 0 10px;font-size:22px;line-height:1.3;font-weight:700;color:#0b2545;">$heading</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#4d5b70;">$intro</p>

              <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#13315c;">$code_label</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td align="center" style="background-color:#f1f5fb;border:2px dashed #13315c;border-radius:10px;padding:18px 8px;">
                    <span class="code" style="font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:36px;font-weight:700;letter-spacing:10px;color:#0b2545;">$code</span>
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:20px;">
                <tr>
                  <td style="background-color:#fdf6e3;border-left:4px solid #c9a227;border-radius:6px;padding:12px 14px;font-size:14px;line-height:1.5;color:#5c4a12;">
                    &#9201;&nbsp;<strong>$expiry</strong>
                  </td>
                </tr>
              </table>

              <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#4d5b70;">$ignore</p>
              <p style="margin:8px 0 0;font-size:13px;line-height:1.6;color:#4d5b70;">$never_share</p>
            </td>
          </tr>
        </table>

        <p style="margin:18px 0 0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#8792a2;">
          $footer
        </p>

      </td>
    </tr>
  </table>
</body>
</html>
