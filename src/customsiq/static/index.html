<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CustomsIQ — Trade Compliance Toolkit</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="description" content="An EU trade-compliance toolkit — HS/CN classification, denied-party screening, duty calculation and composite risk scoring, now running the real 13,733-code EU Combined Nomenclature.">
<meta property="og:type" content="website">
<meta property="og:title" content="CustomsIQ — EU Trade Compliance Toolkit">
<meta property="og:description" content="An EU trade-compliance toolkit — HS/CN classification, denied-party screening, duty calculation and composite risk scoring, now running the real 13,733-code EU Combined Nomenclature.">
<meta property="og:image" content="https://customsiq-gs0u.onrender.com/static/og-image.png">
<meta property="og:url" content="https://customsiq-gs0u.onrender.com/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #dee1e7;
    --text: #161a22;
    --text-dim: #5b6472;
    --primary: #1d3557;
    --primary-dim: #14273f;
    --primary-soft: #e9edf3;
    --accent-screen: #b45309;
    --accent-classify: #3a6ea5;
    --accent-duty: #2f6f4f;
    --amber: #b45309;
    --red: #b3261e;
    --green: #1e7a3d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  code, .mono {
    font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  /* ---------- header ---------- */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
  }

  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 16px;
  }

  h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--primary-dim);
  }

  h1 .accent { color: var(--primary); font-weight: 700; }

  h1 a {
    color: inherit;
    text-decoration: none;
  }

  .tagline {
    color: var(--text-dim);
    font-size: 13.5px;
  }

  .header-links {
    margin-left: auto;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-links a {
    color: var(--text-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .header-links a:hover,
  .header-links a:focus-visible { color: var(--primary); border-bottom-color: var(--primary); }

  /* ---------- language switcher ---------- */
  .lang-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .lang-btn {
    padding: 5px 10px;
    background: var(--surface);
    color: var(--text-dim);
    border: none;
    border-right: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    font-family: inherit;
  }

  .lang-btn:last-child { border-right: none; }
  .lang-btn:hover:not(.active) { background: var(--primary-soft); color: var(--text); }
  .lang-btn.active { background: var(--primary); color: #ffffff; }
  .lang-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

  /* ---------- layout ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
    header { padding: 16px; }
    .header-links { margin-left: 0; width: 100%; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  .panel-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panel-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--primary-dim);
  }

  .panel-head .rule {
    width: 3px;
    height: 17px;
    background: var(--primary);
    border-radius: 2px;
  }

  .panel-head.alt .rule { background: var(--accent-screen); }
  .panel-head.calc .rule { background: var(--accent-duty); }
  .panel-head.cls .rule { background: var(--accent-classify); }

  .card.cls { border-left-color: var(--accent-classify); }
  .card.cls .bar span { background: var(--accent-classify); }

  .terms { margin-top: 8px; }
  .terms .label { color: var(--text-dim); font-size: 11.5px; margin-right: 6px; }
  .chip.term { border-color: #c3d3e3; color: var(--accent-classify); }

  /* The duty panel has three fields, so it takes a full-width row of its own. */
  .panel.wide { grid-column: 1 / -1; }

  .card.calc { border-left-color: var(--accent-duty); }

  .amount {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--primary-dim);
  }

  .breakdown {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    margin: 10px 0 8px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .breakdown b { color: var(--text); font-weight: 600; }

  .panel-body { padding: 18px; }

  .hint {
    margin: 0 0 14px;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ---------- form ---------- */
  form { display: flex; gap: 8px; flex-wrap: wrap; }

  label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .field { flex: 1 1 220px; }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    outline: 2px solid var(--primary);
    outline-offset: -1px;
    border-color: var(--primary);
  }

  button {
    align-self: flex-end;
    padding: 10px 20px;
    background: var(--primary);
    color: #ffffff;
    border: 1px solid var(--primary);
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  button:hover:not(:disabled) { background: var(--primary-dim); border-color: var(--primary-dim); }
  button:focus-visible { outline: 2px solid var(--primary-dim); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: default; }

  /* ---------- results ---------- */
  .results { margin-top: 16px; display: grid; gap: 10px; }

  .card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: 4px;
    padding: 12px 14px;
  }

  .card.hit { border-left-color: var(--red); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }

  .card-title { font-weight: 700; font-size: 15px; color: var(--text); }
  .card-title.mono { letter-spacing: 0.4px; }

  .score {
    color: var(--text-dim);
    font-size: 12.5px;
    white-space: nowrap;
  }

  .card-desc { margin: 5px 0 9px; font-size: 14px; }

  .meta { color: var(--text-dim); font-size: 12.5px; margin: 4px 0 9px; }

  .chip {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-right: 6px;
    background: var(--surface);
  }

  .bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar span {
    display: block;
    height: 100%;
    background: var(--primary);
  }

  .card.hit .bar span { background: var(--red); }

  /* ---------- states ---------- */
  .state {
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 14px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
  }

  .state.clean {
    border-left: 3px solid var(--green);
    color: var(--text);
  }

  .state.warn {
    border-left: 3px solid var(--amber);
    background: #fdf3e6;
    color: #7a4a08;
    font-weight: 600;
  }

  .state.error {
    border-left: 3px solid var(--red);
    background: #fbeceb;
    color: #8c2018;
  }

  /* ---------- footer ---------- */
  footer {
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 24px 40px;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  footer .disclaimer {
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  footer strong { color: #8a5a05; }
  footer a { color: var(--primary); }

  /* ---------- account chip + auth panel ---------- */
  .auth-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .auth-chip button {
    padding: 5px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  .auth-user { display: flex; align-items: center; gap: 6px; }
  .auth-user[hidden] { display: none; }
  .auth-user strong { color: var(--text); font-weight: 600; }

  .role-badge {
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .legacy-badge {
    padding: 1px 6px;
    margin-left: 5px;
    border-radius: 9px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 600;
  }

  /* ---------- SAP GTS terminology view ---------- */
  .sim-notice {
    margin: 0 0 14px;
    padding: 10px 12px;
    background: #fdf6e7;
    border: 1px solid #e3cfa2;
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    color: #6b4c12;
    font-size: 12.5px;
    line-height: 1.55;
  }

  .sim-notice strong { color: #8a5a05; }

  .gts-header {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 6px 14px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }

  .gts-header div { display: flex; gap: 6px; }
  .gts-header .k { color: var(--text-dim); }
  .gts-header .v { font-weight: 600; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .gts-row {
    display: grid;
    grid-template-columns: 26px 46px 150px 1fr;
    gap: 10px;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }

  .gts-row:last-child { border-bottom: none; }
  .gts-row .num, .gts-row .param { color: var(--text-dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .msg-type {
    display: inline-block;
    width: 20px;
    text-align: center;
    border-radius: 3px;
    font-weight: 700;
    font-size: 11.5px;
    line-height: 18px;
    color: #fff;
  }

  .msg-type.E { background: var(--red); }
  .msg-type.W { background: var(--amber); }
  .msg-type.S { background: var(--green); }
  .msg-type.I { background: var(--text-dim); }

  .doc-status {
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  .doc-status.BLOCKED { background: #fbeceb; color: #8c2018; }
  .doc-status.PENDING { background: #fdf3e3; color: #8a5a05; }
  .doc-status.RELEASED, .doc-status.NOT_BLOCKED { background: #e8f3ec; color: #1e7a3d; }

  @media (max-width: 620px) {
    .gts-row { grid-template-columns: 26px 46px 1fr; }
    .gts-row .param { grid-column: 3; }
  }

  /* ---------- invoice extraction ---------- */
  input[type="file"] {
    width: 100%;
    padding: 7px 8px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }

  input[type="file"]::file-selector-button {
    margin-right: 10px;
    padding: 4px 10px;
    background: var(--primary-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  #invoice-prefill {
    background: var(--surface);
    border: 1px solid var(--primary);
    color: var(--primary);
  }

  .field-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .field-row:last-child { border-bottom: none; }
  .field-row .field-name { min-width: 150px; color: var(--text-dim); }
  .field-row .field-value { font-weight: 600; color: var(--text); }

  /* ---------- review controls ---------- */
  .review {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }

  .review-btns { display: flex; gap: 6px; margin-bottom: 6px; }

  .review-btns button {
    padding: 4px 10px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    font-family: inherit;
  }

  .review-btns button[data-decision="approved"] { border: 1px solid var(--green); color: var(--green); }
  .review-btns button[data-decision="rejected"] { border: 1px solid var(--red); color: var(--red); }
  .review-btns button[data-decision="flagged"] { border: 1px solid var(--amber); color: var(--amber); }
  .review-btns button:disabled { opacity: 0.55; cursor: default; }

  .review-comment {
    display: block;
    width: 100%;
    padding: 6px 8px;
    margin-bottom: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
  }

  .review-status { font-size: 12px; color: var(--text-dim); min-height: 14px; }
  .review-status.error-text { color: var(--red); }
  .review-status.ok-text { color: var(--green); }

  /* ---------- code version history ---------- */
  .history-toggle {
    background: none;
    border: none;
    padding: 0;
    margin-top: 6px;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
  }

  .history-toggle:hover { color: var(--primary); }

  .history-panel {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    display: grid;
    gap: 6px;
  }

  .history-row {
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .history-row b { color: var(--text); font-weight: 600; }

  /* ---------- dashboard ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }

  .stat-tile {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary-dim);
    line-height: 1.2;
  }

  .stat-label {
    font-size: 11.5px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .dash-section { margin-top: 20px; }

  .dash-section h3 {
    margin: 0 0 10px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .dash-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 820px) {
    .dash-columns { grid-template-columns: 1fr; }
  }

  .decision-bar-row {
    display: grid;
    grid-template-columns: 90px 1fr 60px;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .decision-bar-row .bar span.approved { background: var(--green); }
  .decision-bar-row .bar span.rejected { background: var(--red); }
  .decision-bar-row .bar span.flagged { background: var(--amber); }

  .dash-list { display: grid; gap: 6px; margin-top: 8px; }

  .dash-row {
    font-size: 12.5px;
    color: var(--text-dim);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .dash-row:last-child { border-bottom: none; }
  .dash-row b { color: var(--text); font-weight: 600; }

  /* ---------- risk assessment ---------- */
  .panel-head.risk .rule { background: var(--amber); }

  .risk-result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .risk-score {
    font-size: 26px;
    font-weight: 700;
    color: var(--primary-dim);
  }

  .level-chip {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .level-chip.low { background: #e7f5ec; color: var(--green); border: 1px solid var(--green); }
  .level-chip.medium { background: #fdf3e6; color: #7a4a08; border: 1px solid var(--amber); }
  .level-chip.high { background: #fbeceb; color: #8c2018; border: 1px solid var(--red); }

  .risk-factor-row {
    display: grid;
    grid-template-columns: 120px 1fr 50px;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .risk-factor-row .bar span.screening { background: var(--accent-screen); }
  .risk-factor-row .bar span.classification { background: var(--accent-classify); }
  .risk-factor-row .bar span.duty { background: var(--accent-duty); }

  .risk-factor-explain {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 10px 130px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1><a href="/">Customs<span class="accent">IQ</span></a></h1>
    <span class="tagline" data-i18n="tagline"></span>
    <span class="header-links">
      <span class="auth-chip" id="auth-chip">
        <span class="auth-user" id="auth-user" hidden>
          <strong id="auth-username"></strong>
          <span class="role-badge" id="auth-role"></span>
        </span>
        <button type="button" id="auth-toggle" data-i18n="auth.signIn"></button>
      </span>
      <span class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="tr">TR</button>
        <button type="button" class="lang-btn" data-lang="de">DE</button>
      </span>
      <a href="/docs" data-i18n="apiReference"></a>
    </span>
  </div>
</header>

<main>
  <!-- ============ Dashboard ============ -->
  <section class="panel wide">
    <div class="panel-head">
      <span class="rule"></span>
      <h2 data-i18n="dashboard.title"></h2>
    </div>
    <div class="panel-body">
      <p class="hint" data-i18n="dashboard.hint"></p>

      <div class="stat-grid" id="dash-stat-grid"></div>

      <div class="dash-columns">
        <div class="dash-section">
          <h3 data-i18n="dashboard.reviewActivity"></h3>
          <div id="dash-decision-bars"></div>
          <div id="dash-subject-chips"></div>
          <div class="dash-list" id="dash-recent-reviews"></div>
        </div>
        <div class="dash-section">
          <h3 data-i18n="dashboard.importPipeline"></h3>
          <div class="dash-list" id="dash-recent-imports"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ HS / CN code search ============ -->
  <section class="panel">
    <div class="panel-head">
      <span class="rule"></span>
      <h2 data-i18n="search.title"></h2>
    </div>
    <div class="panel-body">
      <p class="hint" data-i18n="search.hint"></p>
      <form id="search-form">
        <div class="field">
          <label for="search-input" data-i18n="search.label"></label>
          <input type="text" id="search-input" data-i18n-placeholder="search.placeholder" autocomplete="off">
        </div>
        <button type="submit" id="search-btn" data-i18n="search.button"></button>

  function detectLang() {
    const stored = localStorage.getItem("customsiq_lang");
    if (stored && STRINGS[stored]) return stored;
    const browser = (navigator.language || "en").slice(0, 2);
    return STRINGS[browser] ? browser : "en";
  }

  let lang = detectLang();

  function t(key) {
    const parts = key.split(".");
    let value = STRINGS[lang];
    for (const part of parts) value = value ? value[part] : undefined;
    if (value === undefined) {
      value = STRINGS.en;
      for (const part of parts) value = value ? value[part] : undefined;
    }
    return value;
  }

  function applyStaticTranslations() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll("[data-i18n-html]").forEach((el) => {
      el.innerHTML = t(el.dataset.i18nHtml);
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
  }

  document.querySelectorAll(".lang-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      lang = btn.dataset.lang;
      localStorage.setItem("customsiq_lang", lang);
      applyStaticTranslations();
      renderAuthChip();
      loadReviewHistory();
      loadDashboard();
    });
  });

  applyStaticTranslations();

  // ---------- account state ----------
  // Mirrors the server's src/customsiq/auth.py PERMISSIONS table. The server
  // is the authority — this copy only decides what to *offer*, so a stale copy
  // can annoy a user but never grant them anything.
  const ROLE_ORDER = ["viewer", "analyst", "compliance_officer", "admin"];
  const REVIEW_REQUIRES = {
    classification: "analyst",
    duty: "analyst",
    screening: "compliance_officer",
  };

  let currentUser = null;

  const authUserEl = document.getElementById("auth-user");
  const authToggle = document.getElementById("auth-toggle");

  function canReview(subjectType) {
    const required = REVIEW_REQUIRES[subjectType];
    if (!currentUser || !required) return false;
    return ROLE_ORDER.indexOf(currentUser.role) >= ROLE_ORDER.indexOf(required);
  }

  function legacyBadge(row) {
    if (row.authenticated) return "";
    return `<span class="legacy-badge" title="${escapeHtml(t("reviewHistory.legacyTitle"))}">${escapeHtml(t("reviewHistory.legacy"))}</span>`;
  }

  function renderAuthChip() {
    authUserEl.hidden = !currentUser;
    if (currentUser) {
      document.getElementById("auth-username").textContent = currentUser.username;
      document.getElementById("auth-role").textContent = currentUser.role.replace(/_/g, " ");
    }
    authToggle.textContent = currentUser ? t("auth.signOut") : t("auth.signIn");
  }

  function setCurrentUser(user) {
    currentUser = user;
    renderAuthChip();
    loadReviewHistory();
    loadDashboard();
  }

  authToggle.addEventListener("click", async () => {
    if (!currentUser) {
      window.location.href = "/login";
      return;
    }
    await fetch("/auth/logout", { method: "POST" });
    setCurrentUser(null);
  });

  async function loadCurrentUser() {
    try {
      const response = await fetch("/auth/me");
      const payload = await response.json();
      currentUser = response.ok ? payload.user : null;
    } catch (err) {
      currentUser = null;
    }
    renderAuthChip();
  }

  // ---------- shared helpers ----------
  const pct = (score) => Math.round(score * 100);
  const pct0 = (count, total) => (total > 0 ? Math.round((count / total) * 100) : 0);

  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));

  function setState(box, cls, message) {
    box.innerHTML = `<div class="state ${cls}">${escapeHtml(message)}</div>`;
  }

  /**
   * Render a server-supplied explanation in the viewer's language.
   *
   * The API sends each explanation twice over: a pre-rendered English
   * sentence, and the same reasoning as a key plus its parameters. The CLI
   * and plain API clients keep the sentence; the browser re-renders it here
   * from `table`, so word order, the decimal separator and where the percent
   * sign goes are each language's own business rather than English's.
   *
   * `table` is passed in already resolved (e.g. t("duty.explanation")) so the
   * key stays a literal in the source, where the i18n completeness test can
   * see it. An unknown key falls back to the English sentence rather than
   * rendering nothing.
   */
  function explain(table, row) {
    const template = table[row.explanation_key];
    return template ? template(row.explanation_params) : row.explanation;
  }

  /**
   * Markup for the Approve/Reject/Flag controls on one result card.
   * subjectReference is always the value the backend computed and returned
   * with that result — never re-derived here — so review actions always
   * link back to the exact same audit subject.
   */
  function reviewControlsHtml(subjectType, subjectReference) {
    // One gate for all five panels: the server enforces this too (401/403),
    // this just avoids offering a button that is going to be refused.
    if (!currentUser) {
      return `<div class="review"><div class="review-status">${escapeHtml(t("auth.loginToReview"))}</div></div>`;
    }
    if (!canReview(subjectType)) {
      return `<div class="review"><div class="review-status">${escapeHtml(t("auth.roleCannotReview")(currentUser.role))}</div></div>`;
    }
    return `
      <div class="review" data-subject-type="${escapeHtml(subjectType)}" data-subject-reference="${escapeHtml(subjectReference)}">
        <div class="review-btns">
          <button type="button" class="review-btn" data-decision="approved">${escapeHtml(t("review.approve"))}</button>
          <button type="button" class="review-btn" data-decision="rejected">${escapeHtml(t("review.reject"))}</button>
          <button type="button" class="review-btn" data-decision="flagged">${escapeHtml(t("review.flag"))}</button>
        </div>
        <input type="text" class="review-comment" placeholder="${escapeHtml(t("review.commentPlaceholder"))}">
        <div class="review-status"></div>
      </div>
    `;
  }

  /**
   * "View history" toggle for one CN code. Markup only — click handling and
   * the actual fetch live in toggleCodeHistory, wired up via one delegated
   * listener below, the same pattern reviewControlsHtml/its click handler use.
   */
  function historyToggleHtml(code) {
    return `
      <button type="button" class="history-toggle" data-code="${escapeHtml(code)}">${escapeHtml(t("history.viewLink"))}</button>
      <div class="history-panel" hidden></div>
    `;
  }

  const _historyCache = new Map();

  async function toggleCodeHistory(btn) {
    const panel = btn.nextElementSibling;
    const code = btn.dataset.code;

    if (!panel.hidden) {
      panel.hidden = true;
      btn.textContent = t("history.viewLink");
      return;
    }

    panel.hidden = false;
    btn.textContent = t("history.hideLink");

    if (_historyCache.has(code)) {
      panel.innerHTML = _historyCache.get(code);
      return;
    }

    panel.innerHTML = `<div class="history-row">${escapeHtml(t("history.loading"))}</div>`;
    try {
      const response = await fetch(`/codes/${encodeURIComponent(code)}/history`);
      const versions = await response.json();
      if (!response.ok) {
        panel.innerHTML = `<div class="history-row">${escapeHtml(versions.detail || t("history.couldNotLoad"))}</div>`;
        return;
      }
      const html = !versions.length
        ? `<div class="history-row">${escapeHtml(t("history.empty"))}</div>`
        : versions.map((v) => `
            <div class="history-row">
              <b>${escapeHtml(v.description)}</b> · ${escapeHtml(v.category)}<br>
              ${escapeHtml(v.valid_from)} → ${v.valid_to ? escapeHtml(v.valid_to) : escapeHtml(t("history.current"))}
              <span class="chip">${escapeHtml(v.version_label)}</span>
            </div>
          `).join("");
      _historyCache.set(code, html);
      panel.innerHTML = html;
    } catch (err) {
      panel.innerHTML = `<div class="history-row">${escapeHtml(t("common.couldNotReach"))}</div>`;
    }
  }

  document.addEventListener("click", (event) => {
    const btn = event.target.closest(".history-toggle");
    if (btn) toggleCodeHistory(btn);
  });

  /**
   * Call an endpoint and hand the parsed rows to `render`.
   * The API answers a blank or oversized query with HTTP 400 and a `detail`
   * message, so surface that text rather than a generic failure — but only
   * when it really is text. FastAPI's own 422 validation errors put a list of
   * objects in `detail`, which is truthy, so passing it straight through used
   * to render the literal string "[object Object]". Those are the one error
   * class that can't be translated server-side, so falling back here gives
   * the viewer a translated message instead of Pydantic's English.
   */
  async function submit({ url, input, button, box, busyLabel, idleLabel, render }) {
    const value = input.value.trim();
    if (!value) {
      setState(box, "error", t("common.enterValue"));
      input.focus();
      return;
    }

    button.disabled = true;
    button.textContent = busyLabel;
    setState(box, "", t("common.working"));

    try {
      const response = await fetch(url(value));
      const payload = await response.json();
      if (!response.ok) {
        const detail = typeof payload.detail === "string" ? payload.detail : "";
        setState(box, "error", detail || t("common.requestFailed")(response.status));
        return;
      }
      render(payload);
    } catch (err) {
      setState(box, "error", t("common.couldNotReach"));
    } finally {
      button.disabled = false;
      button.textContent = idleLabel;
    }
  }

  // ---------- HS / CN code search ----------
  const searchBox = document.getElementById("search-results");

  document.getElementById("search-form").addEventListener("submit", (event) => {
    event.preventDefault();
    submit({
      url: (v) => `/search?q=${encodeURIComponent(v)}&limit=8`,
      input: document.getElementById("search-input"),
      button: document.getElementById("search-btn"),
      box: searchBox,
      busyLabel: t("search.busy"),
      idleLabel: t("search.button"),
      render: (rows) => {
        if (!rows.length) {
          setState(searchBox, "", t("search.noMatches"));
          return;
        }
        searchBox.innerHTML = rows.map((row) => `
          <article class="card">
            <div class="card-top">
              <span class="card-title mono">${escapeHtml(row.code)}</span>
              <span class="score">${pct(row.score)}% ${escapeHtml(t("search.matchSuffix"))}</span>
            </div>
            <p class="card-desc">${escapeHtml(row.description)}</p>
            <span class="chip">${escapeHtml(row.category)}</span>
            <div class="bar"><span style="width:${pct(row.score)}%"></span></div>
            ${historyToggleHtml(row.code)}
          </article>
        `).join("");
      },
    });
  });

  // ---------- Sanctions screening ----------
  const screenBox = document.getElementById("screen-results");

  document.getElementById("screen-form").addEventListener("submit", (event) => {
    event.preventDefault();
    submit({
      url: (v) => `/screen?name=${encodeURIComponent(v)}`,
      input: document.getElementById("screen-input"),
      button: document.getElementById("screen-btn"),
      box: screenBox,
      busyLabel: t("screen.busy"),
      idleLabel: t("screen.button"),
      render: (rows) => {
        if (!rows.length) {
          setState(screenBox, "clean", t("screen.clean"));
          return;
        }
        const heading = `<div class="state warn">${t("screen.warn")(rows.length)}</div>`;
        screenBox.innerHTML = heading + rows.map((row) => `
          <article class="card hit">
            <div class="card-top">
              <span class="card-title">${escapeHtml(row.name)}</span>
              <span class="score">${pct(row.score)}% ${escapeHtml(t("search.matchSuffix"))}</span>
            </div>
            <p class="meta">
              ${escapeHtml(row.list_source)} · ${escapeHtml(t("screen.listed"))} ${escapeHtml(row.date_added)}
            </p>
            <span class="chip">${escapeHtml(row.country)}</span>
            <div class="bar"><span style="width:${pct(row.score)}%"></span></div>
            ${reviewControlsHtml("screening", row.subject_reference)}
          </article>
        `).join("");
      },
    });
  });

  // ---------- Classification ----------
  const classifyBox = document.getElementById("classify-results");

  document.getElementById("classify-form").addEventListener("submit", (event) => {
    event.preventDefault();
    submit({
      url: (v) => `/classify?description=${encodeURIComponent(v)}&top_n=5`,
      input: document.getElementById("classify-input"),
      button: document.getElementById("classify-btn"),
      box: classifyBox,
      busyLabel: t("classify.busy"),
      idleLabel: t("classify.button"),
      render: (rows) => {
        if (!rows.length) {
          setState(classifyBox, "", t("classify.noMatches"));
          return;
        }
        classifyBox.innerHTML = rows.map((row) => `
          <article class="card cls">
            <div class="card-top">
              <span class="card-title mono">${escapeHtml(row.code)}</span>
              <span class="score">${pct(row.score)}% ${escapeHtml(t("classify.confidenceSuffix"))}</span>
            </div>
            <p class="card-desc">${escapeHtml(row.description)}</p>
            <span class="chip">${escapeHtml(row.category)}</span>
            <div class="bar"><span style="width:${pct(row.score)}%"></span></div>
            <div class="terms">
              <span class="label">${escapeHtml(t("classify.matchedOn"))}</span>
              ${row.matched_terms.map((term) => `<span class="chip term">${escapeHtml(term)}</span>`).join("")}
            </div>
            ${historyToggleHtml(row.code)}
            ${reviewControlsHtml("classification", row.subject_reference)}
          </article>
        `).join("");
      },
    });
  });

  // ---------- Duty calculation ----------
  const dutyBox = document.getElementById("duty-results");
  const dutyCode = document.getElementById("duty-code");
  const dutyOrigin = document.getElementById("duty-origin");
  const dutyValue = document.getElementById("duty-value");

  const money = (n) =>
    Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  document.getElementById("duty-form").addEventListener("submit", (event) => {
    event.preventDefault();

    // Three fields feed one request, so validate them here rather than in submit().
    if (!dutyCode.value.trim() || !dutyOrigin.value.trim() || !dutyValue.value.trim()) {
      setState(dutyBox, "error", t("duty.validationRequired"));
      return;
    }
    if (isNaN(Number(dutyValue.value.trim()))) {
      setState(dutyBox, "error", t("duty.valueMustBeNumber"));
      return;
    }

    submit({
      url: () =>
        `/calculate-duty?hs_code=${encodeURIComponent(dutyCode.value.trim())}` +
        `&country_of_origin=${encodeURIComponent(dutyOrigin.value.trim())}` +
        `&customs_value=${encodeURIComponent(dutyValue.value.trim())}`,
      input: dutyCode,
      button: document.getElementById("duty-btn"),
      box: dutyBox,
      busyLabel: t("duty.busy"),
      idleLabel: t("duty.button"),
      render: (r) => {
        const agreement = r.trade_agreement
          ? `<span class="chip">${escapeHtml(r.trade_agreement)}</span>`
          : "";
        const rateType = t("duty.rateType")[r.rate_type] || r.rate_type;
        dutyBox.innerHTML = `
          <article class="card calc">
            <div class="card-top">
              <span class="amount">${money(r.duty_amount)}</span>
              <span class="score">${r.rate_percent}% · ${escapeHtml(rateType)}</span>
            </div>
            <div class="breakdown">
              <span>${escapeHtml(t("duty.customsValue"))} <b>${money(r.customs_value)}</b></span>
              <span>${escapeHtml(t("duty.dutyLabel"))} <b>${money(r.duty_amount)}</b></span>
              <span>${escapeHtml(t("duty.totalPayable"))} <b>${money(r.total_payable)}</b></span>
            </div>
            <p class="card-desc">${escapeHtml(explain(t("duty.explanation"), r))}</p>
            <span class="chip">${escapeHtml(r.hs_code)}</span>
            <span class="chip">${escapeHtml(r.country_of_origin)}</span>
            ${agreement}
            ${reviewControlsHtml("duty", r.subject_reference)}
          </article>
        `;
      },
    });
  });

  // ---------- Invoice extraction ----------
  // Upload, show what was found, and only then — on a second, explicit click —
  // write the values into the existing forms. Nothing auto-submits: the user
  // reviews and presses the button they already know.
  const invoiceBox = document.getElementById("invoice-results");
  const invoiceFile = document.getElementById("invoice-file");
  const invoicePrefillBtn = document.getElementById("invoice-prefill");
  let extractedFields = [];

  function renderExtraction(payload) {
    const rows = payload.fields.map((f) => `
      <div class="field-row">
        <span class="field-name">${escapeHtml(t(`invoice.fields.${f.name}`) || f.name)}</span>
        <span class="field-value">${escapeHtml(f.value)}</span>
        <span class="chip">${escapeHtml(t("invoice.matchedOn")(f.label))}</span>
      </div>
    `).join("");

    const missing = payload.missing.length
      ? `<p class="meta">${escapeHtml(t("invoice.missing")(
          payload.missing.map((n) => t(`invoice.fields.${n}`) || n).join(", ")))}</p>`
      : "";
    const notes = payload.notes.map(
      (n) => `<div class="state warn">${escapeHtml(n)}</div>`).join("");

    invoiceBox.innerHTML = `
      ${notes}
      <article class="card cls">
        <div class="card-top">
          <span class="card-title">${escapeHtml(t("invoice.found")(payload.fields.length))}</span>
          <span class="score">${pct(payload.completeness)}%</span>
        </div>
        ${rows}
        ${missing}
      </article>
    `;
  }

  document.getElementById("invoice-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const file = invoiceFile.files[0];
    if (!file) {
      setState(invoiceBox, "error", t("invoice.chooseFile"));
      return;
    }

    const button = document.getElementById("invoice-btn");
    button.disabled = true;
    button.textContent = t("invoice.busy");
    invoicePrefillBtn.hidden = true;
    setState(invoiceBox, "", t("common.working"));

    try {
      // Raw body rather than multipart: no multipart parser is involved on the
      // server at all, which keeps that whole class of parser bugs off the one
      // endpoint that accepts arbitrary bytes.
      const response = await fetch("/extract-invoice", {
        method: "POST",
        headers: { "Content-Type": "application/pdf" },
        body: file,
      });
      const payload = await response.json();
      if (response.status === 401) {
        setState(invoiceBox, "error", t("invoice.needSignIn"));
        return;
      }
      if (!response.ok) {
        setState(invoiceBox, "error", payload.detail || t("invoice.failed"));
        return;
      }
      extractedFields = payload.fields;
      renderExtraction(payload);
      invoicePrefillBtn.hidden = payload.fields.length === 0;
    } catch (err) {
      setState(invoiceBox, "error", t("common.couldNotReach"));
    } finally {
      button.disabled = false;
      button.textContent = t("invoice.button");
    }
  });

  invoicePrefillBtn.addEventListener("click", () => {
    const value = (name) => {
      const field = extractedFields.find((f) => f.name === name);
      return field ? field.value : "";
    };
    const description = value("description");
    const hsCode = value("hs_code");
    const origin = value("country_of_origin");
    const party = value("party_name");
    const customsValue = value("customs_value");

    // The risk panel already decides whether its single subject field is a code
    // or a description (looksLikeHsCode), so hand it whichever we have.
    const targets = [
      ["classify-input", description],
      ["duty-code", hsCode],
      ["duty-origin", origin],
      ["duty-value", customsValue],
      ["risk-subject", hsCode || description],
      ["risk-origin", origin],
      ["risk-party", party],
      ["risk-value", customsValue],
    ];

    let filled = 0;
    targets.forEach(([id, v]) => {
      if (!v) return;
      document.getElementById(id).value = v;
      filled += 1;
    });

    const status = document.createElement("p");
    status.className = "meta";
    status.textContent = filled
      ? t("invoice.prefilled")(filled)
      : t("invoice.nothingToPrefill");
    invoiceBox.appendChild(status);
  });

  // ---------- Shipment risk assessment ----------
  const riskBox = document.getElementById("risk-results");
  const riskSubject = document.getElementById("risk-subject");
  const riskOrigin = document.getElementById("risk-origin");
  const riskParty = document.getElementById("risk-party");
  const riskValue = document.getElementById("risk-value");

  // A pure 8- or 10-digit field is treated as an HS/TARIC code; anything else
  // is sent as a free-text description — mirrors validate_cn_code's shape
  // without duplicating it, so the backend is still the one source of truth.
  const looksLikeHsCode = (v) => /^\d{8}(\d{2})?$/.test(v);

  document.getElementById("risk-form").addEventListener("submit", (event) => {
    event.preventDefault();

    const subject = riskSubject.value.trim();
    if (!subject || !riskOrigin.value.trim() || !riskParty.value.trim() || !riskValue.value.trim()) {
      setState(riskBox, "error", t("risk.validationRequired"));
      return;
    }
    if (isNaN(Number(riskValue.value.trim()))) {
      setState(riskBox, "error", t("risk.valueMustBeNumber"));
      return;
    }

    submit({
      url: () => {
        const params = new URLSearchParams({
          country_of_origin: riskOrigin.value.trim(),
          party_name: riskParty.value.trim(),
          customs_value: riskValue.value.trim(),
        });
        params.set(looksLikeHsCode(subject) ? "hs_code" : "description", subject);
        return `/assess-risk?${params.toString()}`;
      },
      input: riskSubject,
      button: document.getElementById("risk-btn"),
      box: riskBox,
      busyLabel: t("risk.busy"),
      idleLabel: t("risk.button"),
      render: (r) => {
        const codeChip = r.hs_code ? `<span class="chip mono">${escapeHtml(r.hs_code)}</span>` : "";
        const factorRows = r.factors.map((f) => `
          <div class="risk-factor-row">
            <span>${escapeHtml(t(`risk.factor.${f.name}`))}</span>
            <div class="bar"><span class="${f.name}" style="width:${Math.round(f.score * 100)}%"></span></div>
            <span>${Math.round(f.score * 100)}%</span>
          </div>
          <p class="risk-factor-explain">${escapeHtml(explain(t("risk.explanation"), f))}</p>
        `).join("");
        riskBox.innerHTML = `
          <article class="card">
            <div class="risk-result-header">
              <span class="risk-score">${r.composite_score.toFixed(4)}</span>
              <span class="level-chip ${r.level}">${escapeHtml(t(`risk.level.${r.level}`))}</span>
            </div>
            ${codeChip}
            ${factorRows}
          </article>
        `;
      },
    });
  });

  // ---------- SAP GTS terminology view ----------
  // Reads the four risk-assessment inputs rather than duplicating a form: this
  // renders that same assessment in GTS vocabulary and computes nothing itself.
  const sapGtsBox = document.getElementById("sapgts-results");

  function renderGtsDocument(payload) {
    const header = payload.HEADER;
    const rows = payload.RETURN.map((r) => `
      <div class="gts-row">
        <span class="msg-type ${escapeHtml(r.TYPE)}">${escapeHtml(r.TYPE)}</span>
        <span class="num">${escapeHtml(r.NUMBER)}</span>
        <span class="param">${escapeHtml(r.PARAMETER)}</span>
        <span>${escapeHtml(r.MESSAGE)}</span>
      </div>
    `).join("");

    sapGtsBox.innerHTML = `
      <article class="card">
        <div class="gts-header">
          <div><span class="k">${escapeHtml(t("sapGts.documentType"))}</span><span class="v">${escapeHtml(header.DOCUMENT_TYPE)}</span></div>
          <div><span class="k">${escapeHtml(t("sapGts.status"))}</span><span class="doc-status ${escapeHtml(header.DOCUMENT_STATUS)}">${escapeHtml(header.DOCUMENT_STATUS)}</span></div>
          <div><span class="k">${escapeHtml(t("sapGts.areas"))}</span><span class="v">${escapeHtml(header.FUNCTIONAL_AREAS.join(" · "))}</span></div>
          <div><span class="k">${escapeHtml(t("sapGts.sourceSystem"))}</span><span class="v">${escapeHtml(header.SOURCE_SYSTEM)}</span></div>
        </div>
        <p class="meta">${escapeHtml(t("sapGts.returnTable")(payload.RETURN.length))}</p>
        ${rows}
        <p class="meta">${escapeHtml(header.DISCLAIMER)}</p>
      </article>
    `;
  }

  document.getElementById("sapgts-form").addEventListener("submit", (event) => {
    event.preventDefault();

    const subject = riskSubject.value.trim();
    if (!subject || !riskOrigin.value.trim() || !riskParty.value.trim() || !riskValue.value.trim()) {
      setState(sapGtsBox, "error", t("sapGts.fillRiskForm"));
      return;
    }
    if (isNaN(Number(riskValue.value.trim()))) {
      setState(sapGtsBox, "error", t("sapGts.valueMustBeNumber"));
      return;
    }

    submit({
      url: () => {
        const params = new URLSearchParams({
          country_of_origin: riskOrigin.value.trim(),
          party_name: riskParty.value.trim(),
          customs_value: riskValue.value.trim(),
        });
        params.set(looksLikeHsCode(subject) ? "hs_code" : "description", subject);
        return `/sap-gts/compliance-check?${params.toString()}`;
      },
      input: riskSubject,
      button: document.getElementById("sapgts-btn"),
      box: sapGtsBox,
      busyLabel: t("sapGts.busy"),
      idleLabel: t("sapGts.button"),
      render: renderGtsDocument,
    });
  });

  // ---------- Review submission + history ----------
  const reviewHistoryBox = document.getElementById("review-history-results");

  async function loadReviewHistory() {
    try {
      const response = await fetch("/review/history?limit=20");
      const rows = await response.json();
      if (response.status === 401) {
        setState(reviewHistoryBox, "", t("reviewHistory.restricted"));
        return;
      }
      if (!response.ok) {
        setState(reviewHistoryBox, "error", rows.detail || t("reviewHistory.couldNotLoad"));
        return;
      }
      if (!rows.length) {
        setState(reviewHistoryBox, "", t("reviewHistory.empty"));
        return;
      }
      reviewHistoryBox.innerHTML = rows.map((r) => `
        <article class="card">
          <div class="card-top">
            <span class="card-title">${escapeHtml(r.decision)}</span>
            <span class="score">${escapeHtml(r.reviewed_at)}</span>
          </div>
          <p class="meta">${escapeHtml(r.subject_type)} · ${escapeHtml(r.subject_reference)}</p>
          <span class="chip">${escapeHtml(r.reviewer_name)}</span>${legacyBadge(r)}
          ${r.comment ? `<p class="card-desc">${escapeHtml(r.comment)}</p>` : ""}
        </article>
      `).join("");
    } catch (err) {
      setState(reviewHistoryBox, "error", t("common.couldNotReach"));
    }
  }

  document.addEventListener("click", async (event) => {
    const btn = event.target.closest(".review-btn");
    if (!btn) return;

    const wrap = btn.closest(".review");
    const statusEl = wrap.querySelector(".review-status");
    if (!currentUser) {
      statusEl.textContent = t("auth.loginToReview");
      statusEl.className = "review-status error-text";
      return;
    }

    const commentInput = wrap.querySelector(".review-comment");
    btn.disabled = true;
    statusEl.textContent = t("review.submitting");
    statusEl.className = "review-status";

    try {
      const response = await fetch("/review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subject_type: wrap.dataset.subjectType,
          subject_reference: wrap.dataset.subjectReference,
          decision: btn.dataset.decision,
          comment: commentInput.value.trim() || null,
        }),
      });
      const payload = await response.json();
      if (!response.ok) {
        statusEl.textContent = payload.detail || t("review.couldNotRecord");
        statusEl.className = "review-status error-text";
        return;
      }
      statusEl.textContent = t("review.recorded")(payload.decision);
      statusEl.className = "review-status ok-text";
      loadReviewHistory();
    } catch (err) {
      statusEl.textContent = t("common.couldNotReach");
      statusEl.className = "review-status error-text";
    } finally {
      btn.disabled = false;
    }
  });

  // Identity first: the review controls and the audit log both render
  // differently depending on it, so one await here avoids a visible reflow.
  loadCurrentUser().then(loadReviewHistory);

  // ---------- Dashboard ----------
  async function loadDashboard() {
    const grid = document.getElementById("dash-stat-grid");
    try {
      const response = await fetch("/dashboard/stats");
      const stats = await response.json();
      if (!response.ok) {
        setState(grid, "error", stats.detail || t("dashboard.couldNotLoad"));
        return;
      }
      renderDashboard(stats);
    } catch (err) {
      setState(grid, "error", t("common.couldNotReach"));
    }
  }

  function renderDashboard(stats) {
    const tiles = [
      [stats.hs_code_count, t("dashboard.hsCodes")],
      [stats.sanctioned_entity_count, t("dashboard.entities")],
      [stats.tariff_rate_count, t("dashboard.rates")],
      [stats.review_total, t("dashboard.reviewsRecorded")],
      [stats.versioned_code_count, t("dashboard.versionedCodes")],
    ];
    document.getElementById("dash-stat-grid").innerHTML = tiles.map(([value, label]) => `
      <div class="stat-tile">
        <div class="stat-value">${value}</div>
        <div class="stat-label">${escapeHtml(label)}</div>
      </div>
    `).join("");

    const total = stats.review_total;
    const decisions = [
      ["approved", t("review.approve")],
      ["rejected", t("review.reject")],
      ["flagged", t("review.flag")],
    ];
    document.getElementById("dash-decision-bars").innerHTML = decisions.map(([key, label]) => {
      const count = stats.review_by_decision[key];
      const width = pct0(count, total);
      return `
        <div class="decision-bar-row">
          <span>${escapeHtml(label)}</span>
          <div class="bar"><span class="${key}" style="width:${width}%"></span></div>
          <span>${count} (${width}%)</span>
        </div>
      `;
    }).join("");

    const subjects = [
      ["classification", t("classify.title")],
      ["screening", t("screen.title")],
      ["duty", t("duty.title")],
    ];
    document.getElementById("dash-subject-chips").innerHTML = subjects.map(([key, label]) =>
      `<span class="chip">${escapeHtml(label)}: ${stats.review_by_subject_type[key]}</span>`
    ).join("");

    // Counts stay public; who reviewed what does not — the server sends this
    // array empty with recent_reviews_restricted for anonymous visitors.
    document.getElementById("dash-recent-reviews").innerHTML = stats.recent_reviews_restricted
      ? `<div class="dash-row">${escapeHtml(t("auth.restricted"))}</div>`
      : !stats.recent_reviews.length
      ? `<div class="dash-row">${escapeHtml(t("dashboard.noReviews"))}</div>`
      : stats.recent_reviews.map((r) => `
          <div class="dash-row">
            <b>${escapeHtml(r.decision)}</b> · ${escapeHtml(r.subject_type)} ·
            ${escapeHtml(r.reviewer_name)}${legacyBadge(r)} · ${escapeHtml(r.reviewed_at)}
          </div>
        `).join("");

    document.getElementById("dash-recent-imports").innerHTML = !stats.recent_import_runs.length
      ? `<div class="dash-row">${escapeHtml(t("dashboard.noImports"))}</div>`
      : stats.recent_import_runs.map((s) => `
          <div class="dash-row">
            <b>${escapeHtml(s.version_label)}</b> · ${escapeHtml(s.imported_at)} ·
            ${s.row_count} ${escapeHtml(t("dashboard.codesProcessed"))}
            (${s.changed_count} ${escapeHtml(t("dashboard.changed"))},
            ${s.unchanged_count} ${escapeHtml(t("dashboard.unchanged"))})
          </div>
        `).join("");
  }

  loadDashboard();
</script>

</body>
</html>
