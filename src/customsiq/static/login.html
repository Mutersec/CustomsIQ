<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — CustomsIQ</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #dee1e7;
  --text: #161a22;
  --text-dim: #5b6472;
  --primary: #1d3557;
  --primary-dim: #14273f;
  --primary-soft: #e9edf3;
  --red: #b3261e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

/* ---------- header ---------- */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 24px;
}

.header-inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 16px;
}

h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 0.2px;
  color: var(--primary-dim);
}

h1 .accent { color: var(--primary); font-weight: 700; }

h1 a {
  color: inherit;
  text-decoration: none;
}

.header-links {
  margin-left: auto;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.header-links a {
  color: var(--text-dim);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}

.header-links a:hover,
.header-links a:focus-visible { color: var(--primary); border-bottom-color: var(--primary); }

/* ---------- language switcher ---------- */
.lang-switch {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.lang-btn {
  padding: 5px 10px;
  background: var(--surface);
  color: var(--text-dim);
  border: none;
  border-right: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  font-family: inherit;
}

.lang-btn:last-child { border-right: none; }
.lang-btn:hover:not(.active) { background: var(--primary-soft); color: var(--text); }
.lang-btn.active { background: var(--primary); color: #ffffff; }
.lang-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

/* ---------- layout ---------- */
main {
  max-width: 420px;
  margin: 48px auto;
  padding: 0 24px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
}

.panel-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.panel-head h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--primary-dim);
}

.panel-head .rule {
  width: 3px;
  height: 17px;
  background: var(--primary);
  border-radius: 2px;
}

.panel-body { padding: 18px; }

.hint {
  margin: 0 0 14px;
  color: var(--text-dim);
  font-size: 13px;
}

/* ---------- form ---------- */
form { display: flex; gap: 8px; flex-wrap: wrap; }

label {
  display: block;
  font-size: 12px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.field { flex: 1 1 220px; }

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 14.5px;
  font-family: inherit;
}

input[type="text"]:focus,
input[type="password"]:focus {
  outline: 2px solid var(--primary);
  outline-offset: -1px;
  border-color: var(--primary);
}

button {
  align-self: flex-end;
  padding: 10px 20px;
  background: var(--primary);
  color: #ffffff;
  border: 1px solid var(--primary);
  border-radius: 4px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

button:hover:not(:disabled) { background: var(--primary-dim); border-color: var(--primary-dim); }
button:focus-visible { outline: 2px solid var(--primary-dim); outline-offset: 2px; }
button:disabled { opacity: 0.55; cursor: default; }

.auth-tabs { display: flex; gap: 6px; margin-bottom: 12px; }

.auth-tabs button {
  padding: 5px 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  align-self: auto;
}

.auth-tabs button.active {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}

/* ---------- states ---------- */
.state {
  padding: 12px 14px;
  border-radius: 4px;
  font-size: 14px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-dim);
  margin-top: 12px;
}

.state.error {
  border-left: 3px solid var(--red);
  background: #fbeceb;
  color: #8c2018;
}

footer {
  max-width: 420px;
  margin: 0 auto;
  padding: 8px 24px 40px;
  color: var(--text-dim);
  font-size: 12.5px;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1><a href="/">Customs<span class="accent">IQ</span></a></h1>
    <span class="header-links">
      <span class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="tr">TR</button>
        <button type="button" class="lang-btn" data-lang="de">DE</button>
      </span>
      <a href="/" data-i18n="backToApp"></a>
    </span>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <span class="rule"></span>
      <h2 data-i18n="auth.title"></h2>
    </div>
    <div class="panel-body">
      <p class="hint" data-i18n="auth.hint"></p>

      <div class="auth-tabs" role="group">
        <button type="button" class="auth-tab active" data-mode="login" data-i18n="auth.loginTab"></button>
        <button type="button" class="auth-tab" data-mode="register" data-i18n="auth.registerTab"></button>
      </div>

      <form id="auth-form">
        <div class="field">
          <label for="auth-username-input" data-i18n="auth.username"></label>
          <input type="text" id="auth-username-input" autocomplete="username"
                 data-i18n-placeholder="auth.usernamePlaceholder">
        </div>
        <div class="field">
          <label for="auth-password-input" data-i18n="auth.password"></label>
          <input type="password" id="auth-password-input" autocomplete="current-password"
                 data-i18n-placeholder="auth.passwordPlaceholder">
        </div>
        <button type="submit" id="auth-submit" data-i18n="auth.loginTab"></button>
      </form>

      <div class="results" id="auth-results" aria-live="polite"></div>
    </div>
  </section>
</main>

<footer>
  <p data-i18n="auth.demoWarning"></p>
</footer>

<script>
  const STRINGS = {
    en: {
      backToApp: "← Back to app",
      auth: {
        title: "Sign in",
        hint: "Review sign-offs are recorded against your account, so the audit trail names a real reviewer rather than whatever was typed into a box.",
        loginTab: "Sign in",
        registerTab: "Create account",
        username: "Username",
        usernamePlaceholder: "your username",
        password: "Password",
        passwordPlaceholder: "at least 8 characters",
        signedIn: (name) => `Signed in as ${name}.`,
        registered: (name) => `Account created. Signed in as ${name}.`,
        failed: "Sign-in failed.",
        demoWarning: "Public demo credentials on mock data. Never reuse a real password here; accounts reset whenever the free instance restarts. Demo credentials are available on request.",
      },
      common: {
        enterValue: "Please enter a value first.",
        couldNotReach: "Could not reach the API. Check your connection and try again.",
      },
    },
    tr: {
      backToApp: "← Uygulamaya dön",
      auth: {
        title: "Oturum aç",
        hint: "İnceleme onayları hesabınıza kaydedilir; böylece denetim izi bir kutuya yazılan metni değil, gerçek bir inceleyiciyi gösterir.",
        loginTab: "Oturum aç",
        registerTab: "Hesap oluştur",
        username: "Kullanıcı adı",
        usernamePlaceholder: "kullanıcı adınız",
        password: "Parola",
        passwordPlaceholder: "en az 8 karakter",
        signedIn: (name) => `${name} olarak oturum açıldı.`,
        registered: (name) => `Hesap oluşturuldu. ${name} olarak oturum açıldı.`,
        failed: "Oturum açılamadı.",
        demoWarning: "Kurgusal veri üzerinde herkese açık demo bilgileri. Buraya asla gerçek bir parola girmeyin; ücretsiz sunucu her yeniden başladığında hesaplar sıfırlanır. Demo bilgileri istek üzerine paylaşılır.",
      },
      common: {
        enterValue: "Lütfen önce bir değer girin.",
        couldNotReach: "API'ye ulaşılamadı. Bağlantınızı kontrol edip tekrar deneyin.",
      },
    },
    de: {
      backToApp: "← Zurück zur App",
      auth: {
        title: "Anmelden",
        hint: "Freigaben werden Ihrem Konto zugeordnet, damit das Prüfprotokoll eine echte Person nennt und nicht das, was jemand ins Feld getippt hat.",
        loginTab: "Anmelden",
        registerTab: "Konto erstellen",
        username: "Benutzername",
        usernamePlaceholder: "Ihr Benutzername",
        password: "Passwort",
        passwordPlaceholder: "mindestens 8 Zeichen",
        signedIn: (name) => `Angemeldet als ${name}.`,
        registered: (name) => `Konto erstellt. Angemeldet als ${name}.`,
        failed: "Anmeldung fehlgeschlagen.",
        demoWarning: "Öffentliche Demo-Zugangsdaten auf fiktiven Daten. Verwenden Sie hier nie ein echtes Passwort; bei jedem Neustart der kostenlosen Instanz werden die Konten zurückgesetzt. Demo-Zugangsdaten sind auf Anfrage erhältlich.",
      },
      common: {
        enterValue: "Bitte zuerst einen Wert eingeben.",
        couldNotReach: "Die API konnte nicht erreicht werden. Verbindung prüfen und erneut versuchen.",
      },
    },
  };

  function detectLang() {
    const stored = localStorage.getItem("customsiq_lang");
    if (stored && STRINGS[stored]) return stored;
    const browser = (navigator.language || "en").slice(0, 2);
    return STRINGS[browser] ? browser : "en";
  }

  let lang = detectLang();

  function t(key) {
    const parts = key.split(".");
    let value = STRINGS[lang];
    for (const part of parts) value = value ? value[part] : undefined;
    if (value === undefined) {
      value = STRINGS.en;
      for (const part of parts) value = value ? value[part] : undefined;
    }
    return value;
  }

  function applyStaticTranslations() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
    setAuthMode(authMode);
  }

  document.querySelectorAll(".lang-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      lang = btn.dataset.lang;
      localStorage.setItem("customsiq_lang", lang);
      applyStaticTranslations();
    });
  });

  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));

  function setState(box, cls, message) {
    box.innerHTML = `<div class="state ${cls}">${escapeHtml(message)}</div>`;
  }

  let authMode = "login";
  const authResults = document.getElementById("auth-results");
  const authUsernameInput = document.getElementById("auth-username-input");
  const authPasswordInput = document.getElementById("auth-password-input");

  function setAuthMode(mode) {
    authMode = mode;
    document.querySelectorAll(".auth-tab").forEach((tab) => {
      tab.classList.toggle("active", tab.dataset.mode === mode);
    });
    const label = mode === "login" ? t("auth.loginTab") : t("auth.registerTab");
    document.getElementById("auth-submit").textContent = label;
    authPasswordInput.autocomplete = mode === "login" ? "current-password" : "new-password";
  }

  document.querySelectorAll(".auth-tab").forEach((tab) => {
    tab.addEventListener("click", () => setAuthMode(tab.dataset.mode));
  });

  document.getElementById("auth-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const username = authUsernameInput.value.trim();
    const password = authPasswordInput.value;
    if (!username || !password) {
      setState(authResults, "error", t("common.enterValue"));
      return;
    }
    const submitBtn = document.getElementById("auth-submit");
    submitBtn.disabled = true;
    try {
      const response = await fetch(authMode === "login" ? "/auth/login" : "/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const payload = await response.json();
      if (!response.ok) {
        setState(authResults, "error", payload.detail || t("auth.failed"));
        return;
      }
      window.location.href = "/";
    } catch (err) {
      setState(authResults, "error", t("common.couldNotReach"));
    } finally {
      submitBtn.disabled = false;
    }
  });

  applyStaticTranslations();

  (async () => {
    try {
      const response = await fetch("/auth/me");
      const payload = await response.json();
      if (response.ok && payload.user) {
        window.location.href = "/";
      }
    } catch (err) {
      // Stay on the login page if the check fails.
    }
  })();
</script>
</body>
</html>
