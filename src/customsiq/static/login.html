<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — CustomsIQ</title>
<meta name="description" content="CustomsIQ — EU customs classification, sanctions screening and duty calculation. Sign in to continue.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
:root {
  --navy: #0b2545;
  --navy-2: #13315c;
  --gold: #c9a227;
  --gold-soft: #f4e6b5;
  --ink: #0f1b2d;
  --ink-dim: #4d5b70;
  --glass: rgba(255, 255, 255, 0.82);
  --glass-border: rgba(255, 255, 255, 0.55);
  --line: #d7dde6;
  --field: #ffffff;
  --red: #b3261e;
  --red-soft: #fdecea;
  --green: #1e7d4f;
  --green-soft: #e6f4ec;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--ink);
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  /* The scene is the page: no solid backdrop around the card. */
  background: #081a31 url("/static/harbor-scene.svg") center / cover no-repeat fixed;
}

/* A soft vignette keeps the card and header legible over any part of the scene. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(5, 18, 38, 0.55) 0%, rgba(5, 18, 38, 0.05) 30%, rgba(5, 18, 38, 0.15) 70%, rgba(5, 18, 38, 0.6) 100%);
  pointer-events: none;
  z-index: 0;
}

header, main, footer { position: relative; z-index: 1; }

/* ---------- header ---------- */
.header-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
  text-decoration: none;
  min-width: 0;
}
.brand-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.1;
}
.brand-name .accent { color: var(--gold); }
.brand-sub {
  display: block;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.78);
}

.lang-switch {
  display: inline-flex;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 999px;
  overflow: hidden;
  background: rgba(8, 26, 49, 0.35);
  backdrop-filter: blur(6px);
}
.lang-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: #fff;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.6px;
  padding: 6px 13px;
  cursor: pointer;
}
.lang-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.14); }
.lang-btn.active { background: var(--gold); color: var(--navy); }
.lang-btn:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }

/* ---------- card ---------- */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 40px;
}

.card {
  width: 100%;
  max-width: 440px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(3, 12, 28, 0.45);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  overflow: hidden;
}

.card-head {
  padding: 22px 26px 6px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--navy-2);
}
.eyebrow::before {
  content: "";
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: var(--gold);
}
.card h1 {
  margin: 6px 0 4px;
  font-size: 23px;
  line-height: 1.25;
  color: var(--navy);
  overflow-wrap: anywhere;
}
.card .lead {
  margin: 0;
  color: var(--ink-dim);
  font-size: 14px;
  overflow-wrap: anywhere;
}

.card-body { padding: 16px 26px 24px; }

.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 10px;
  background: rgba(11, 37, 69, 0.08);
  margin-bottom: 18px;
}
.tab {
  flex: 1 1 0;
  min-width: 0;
  appearance: none;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-dim);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 9px 8px;
  cursor: pointer;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.tab.active { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(11, 37, 69, 0.18); }
.tab:focus-visible { outline: 2px solid var(--navy-2); outline-offset: 1px; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: var(--navy-2);
  margin-bottom: 5px;
}
.field input {
  width: 100%;
  font: inherit;
  font-size: 15px;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--field);
  color: var(--ink);
}
.field input:focus { outline: none; border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(19, 49, 92, 0.18); }
.field input.code {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 12px;
  text-align: center;
  padding: 10px;
  font-variant-numeric: tabular-nums;
}

.btn {
  width: 100%;
  appearance: none;
  border: 0;
  border-radius: 9px;
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.25;
  padding: 12px 16px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--navy-2); }
.btn-link {
  width: auto;
  background: transparent;
  color: var(--navy-2);
  padding: 6px 4px;
  font-size: 13.5px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 14px;
  color: var(--ink-dim);
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

#google-button { display: flex; justify-content: center; min-height: 44px; }

.verify-note {
  margin: 0 0 14px;
  padding: 12px 14px;
  border-radius: 9px;
  background: var(--gold-soft);
  color: var(--ink);
  font-size: 14px;
  overflow-wrap: anywhere;
}
.verify-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 12px;
  margin-top: 8px;
}

.state {
  margin-top: 14px;
  padding: 10px 13px;
  border-radius: 9px;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.state.error { background: var(--red-soft); color: var(--red); }
.state.ok { background: var(--green-soft); color: var(--green); }

.secure {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 26px;
  border-top: 1px solid rgba(11, 37, 69, 0.08);
  background: rgba(11, 37, 69, 0.04);
  color: var(--ink-dim);
  font-size: 12.5px;
}
.secure svg { flex: none; }

[hidden] { display: none !important; }

/* ---------- footer ---------- */
footer {
  padding: 0 20px 22px;
  text-align: center;
  color: rgba(255, 255, 255, 0.82);
  font-size: 12.5px;
}
footer p { max-width: 640px; margin: 0 auto; }

@media (max-width: 480px) {
  .brand-sub { display: none; }
  .card-head { padding: 18px 18px 4px; }
  .card-body { padding: 14px 18px 20px; }
  .secure { padding: 12px 18px; }
  .card h1 { font-size: 21px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="/login" aria-label="CustomsIQ">
      <span>
        <span class="brand-name">Customs<span class="accent">IQ</span></span>
        <span class="brand-sub" data-i18n="brandSub"></span>
      </span>
    </a>
    <span class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="tr">TR</button>
      <button type="button" class="lang-btn" data-lang="de">DE</button>
    </span>
  </div>
</header>

<main>
  <section class="card" aria-labelledby="card-title">
    <div class="card-head">
      <span class="eyebrow" data-i18n="auth.eyebrow"></span>
      <h1 id="card-title" data-i18n="auth.title"></h1>
      <p class="lead" id="card-lead" data-i18n="auth.hint"></p>
    </div>

    <div class="card-body">
      <!-- Step 1: sign in or create an account -->
      <div id="step-credentials">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" role="tab" data-mode="login" data-i18n="auth.loginTab"></button>
          <button type="button" class="tab" role="tab" data-mode="register" data-i18n="auth.registerTab"></button>
        </div>

        <form id="auth-form" novalidate>
          <div class="field">
            <label for="auth-username-input" id="auth-username-label" data-i18n="auth.usernameOrEmail"></label>
            <input type="text" id="auth-username-input" autocomplete="username" autocapitalize="none"
                   spellcheck="false" data-i18n-placeholder="auth.usernameOrEmailPlaceholder">
          </div>
          <div class="field" id="email-field" hidden>
            <label for="auth-email-input" data-i18n="auth.email"></label>
            <input type="email" id="auth-email-input" autocomplete="email" autocapitalize="none"
                   spellcheck="false" data-i18n-placeholder="auth.emailPlaceholder">
          </div>
          <div class="field">
            <label for="auth-password-input" data-i18n="auth.password"></label>
            <input type="password" id="auth-password-input" autocomplete="current-password"
                   data-i18n-placeholder="auth.passwordPlaceholder">
          </div>
          <button type="submit" class="btn btn-primary" id="auth-submit" data-i18n="auth.loginTab"></button>
        </form>

        <div id="google-block" hidden>
          <div class="divider"><span data-i18n="auth.or"></span></div>
          <div id="google-button"></div>
        </div>
      </div>

      <!-- Step 2: the e-mailed code -->
      <div id="step-verify" hidden>
        <p class="verify-note" id="verify-note"></p>
        <form id="verify-form" novalidate>
          <div class="field">
            <label for="verify-code-input" data-i18n="auth.code"></label>
            <input type="text" id="verify-code-input" class="code" inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="••••••">
          </div>
          <button type="submit" class="btn btn-primary" id="verify-submit" data-i18n="auth.verify"></button>
        </form>
        <div class="verify-actions">
          <button type="button" class="btn btn-link" id="verify-back" data-i18n="auth.back"></button>
          <button type="button" class="btn btn-link" id="verify-resend" data-i18n="auth.resend"></button>
        </div>
      </div>

      <div id="auth-results" aria-live="polite"></div>
    </div>

    <div class="secure">
      <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true">
        <rect x="1" y="7" width="12" height="8" rx="1.5" fill="#4d5b70"/>
        <path d="M4 7 V5 a3 3 0 0 1 6 0 V7" stroke="#4d5b70" stroke-width="1.8" fill="none"/>
      </svg>
      <span data-i18n="auth.secure"></span>
    </div>
  </section>
</main>

<footer>
  <p data-i18n="auth.demoWarning"></p>
</footer>

        mailOff: "Die E-Mail-Bestätigung ist derzeit nicht verfügbar. Bitte versuchen Sie es später erneut.",

        emailExists: "Für diese E-Mail-Adresse besteht bereits ein Konto. Bitte melden Sie sich an.",

        demoWarning: "Demonstrationssystem mit fiktiven und öffentlichen Referenzdaten. Nicht für echte Zollanmeldungen.",

        enterValue: "Bitte füllen Sie alle Felder aus.",
        couldNotReach: "Der Server ist nicht erreichbar. Verbindung prüfen und erneut versuchen.",

  function detectLang() {
    let stored = null;
    try { stored = localStorage.getItem("customsiq_lang"); } catch (err) { /* private mode */ }
    if (stored && STRINGS[stored]) return stored;
    const browser = (navigator.language || "en").slice(0, 2);
    return STRINGS[browser] ? browser : "en";
  }

  let lang = detectLang();
  let authMode = "login";
  let step = "credentials";
  let pendingEmail = "";
  let resendTimer = null;
  let googleClientId = null;

  function t(key) {
    const parts = key.split(".");
    let value = STRINGS[lang];
    for (const part of parts) value = value ? value[part] : undefined;
    if (value === undefined) {
      value = STRINGS.en;
      for (const part of parts) value = value ? value[part] : undefined;
    }
    return value;
  }

  const $ = (id) => document.getElementById(id);
  const results = $("auth-results");
  const usernameInput = $("auth-username-input");
  const emailInput = $("auth-email-input");
  const passwordInput = $("auth-password-input");
  const codeInput = $("verify-code-input");

  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));

  function setState(cls, message) {
    results.innerHTML = message ? `<div class="state ${cls}">${escapeHtml(message)}</div>` : "";
  }

  function renderHeading() {
    const title = step === "verify" ? "auth.verifyTitle"
      : authMode === "register" ? "auth.registerTitle" : "auth.title";
    $("card-title").textContent = t(title);
    $("card-lead").textContent = step === "verify" ? ""
      : t(authMode === "register" ? "auth.registerHint" : "auth.hint");
    $("card-lead").hidden = step === "verify";
    if (step === "verify") $("verify-note").textContent = t("auth.codeSentTo")(pendingEmail);
  }

  function applyStaticTranslations() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const value = t(el.dataset.i18n);
      if (typeof value === "string") el.textContent = value;
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
    setAuthMode(authMode);
    renderHeading();
    renderGoogleButton();
  }

  function setAuthMode(mode) {
    authMode = mode;
    const register = mode === "register";
    document.querySelectorAll(".tab").forEach((tab) => {
      const active = tab.dataset.mode === mode;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
    });
    $("email-field").hidden = !register;
    $("auth-username-label").textContent = t(register ? "auth.username" : "auth.usernameOrEmail");
    usernameInput.placeholder = t(register ? "auth.usernamePlaceholder" : "auth.usernameOrEmailPlaceholder");
    $("auth-submit").textContent = t(register ? "auth.registerTab" : "auth.loginTab");
    passwordInput.autocomplete = register ? "new-password" : "current-password";
    renderHeading();
  }

  function showStep(next) {
    step = next;
    $("step-credentials").hidden = next !== "credentials";
    $("step-verify").hidden = next !== "verify";
    renderHeading();
    if (next === "verify") {
      codeInput.value = "";
      codeInput.focus();
    }
  }

  // The server's error text is English; map it to the visitor's language.
  function explain(status, detail, fallback) {
    const text = String(detail || "").toLowerCase();
    if (status === 429 && text.includes("wait")) {
      const seconds = (text.match(/(\d+)/) || [])[1] || "60";
      return t("auth.tooSoon")(seconds);
    }
    if (status === 429) return t("auth.tooMany");
    if (status === 503 || status === 502) return t("auth.mailOff");
    if (text.includes("already taken")) return t("auth.taken");
    if (text.includes("already exists")) return t("auth.emailExists");
    if (text.includes("e-mail")) return t("auth.badEmail");
    if (text.includes("password must")) return t("auth.weakPassword");
    if (text.includes("username")) return t("auth.badUsername");
    if (text.includes("expired") || text.includes("too many") || text.includes("start again")) return t("auth.restart");
    if (text.includes("not correct")) return t("auth.badCode");
    return fallback;
  }

  async function post(url, body) {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    let payload = {};
    try { payload = await response.json(); } catch (err) { /* empty body */ }
    return { response, payload };
  }

  function startResendCountdown(seconds) {
    const button = $("verify-resend");
    clearInterval(resendTimer);
    let left = seconds;
    const tick = () => {
      if (left <= 0) {
        clearInterval(resendTimer);
        button.disabled = false;
        button.textContent = t("auth.resend");
        return;
      }
      button.disabled = true;
      button.textContent = t("auth.resendIn")(left);
      left -= 1;
    };
    tick();
    resendTimer = setInterval(tick, 1000);
  }

  function goToVerify(email) {
    pendingEmail = email;
    setState("", "");
    showStep("verify");
    startResendCountdown(60);
  }

  document.querySelectorAll(".lang-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      lang = btn.dataset.lang;
      try { localStorage.setItem("customsiq_lang", lang); } catch (err) { /* private mode */ }
      applyStaticTranslations();
    });
  });

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      setState("", "");
      setAuthMode(tab.dataset.mode);
    });
  });

  $("auth-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const email = emailInput.value.trim();
    if (!username || !password || (authMode === "register" && !email)) {
      setState("error", t("common.enterValue"));
      return;
    }
    const submit = $("auth-submit");
    submit.disabled = true;
    try {
      if (authMode === "login") {
        const { response, payload } = await post("/auth/login", { username, password });
        if (!response.ok) {
          setState("error", response.status === 401 ? t("auth.badLogin") : explain(response.status, payload.detail, t("auth.failed")));
          return;
        }
        window.location.href = "/";
        return;
      }
      const { response, payload } = await post("/auth/register", { username, email, password, language: lang });
      if (!response.ok) {
        setState("error", explain(response.status, payload.detail, t("auth.failed")));
        return;
      }
      goToVerify(payload.email);
    } catch (err) {
      setState("error", t("common.couldNotReach"));
    } finally {
      submit.disabled = false;
    }
  });

  codeInput.addEventListener("input", () => {
    codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
  });

  $("verify-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const code = codeInput.value.trim();
    if (code.length !== 6) {
      setState("error", t("auth.badCode"));
      return;
    }
    const submit = $("verify-submit");
    submit.disabled = true;
    try {
      const { response, payload } = await post("/auth/verify", { email: pendingEmail, code });
      if (!response.ok) {
        const message = explain(response.status, payload.detail, t("auth.badCode"));
        setState("error", message);
        if (message === t("auth.restart")) setTimeout(() => showStep("credentials"), 1800);
        return;
      }
      window.location.href = "/";
    } catch (err) {
      setState("error", t("common.couldNotReach"));
    } finally {
      submit.disabled = false;
    }
  });

  $("verify-resend").addEventListener("click", async () => {
    try {
      const { response, payload } = await post("/auth/resend", { email: pendingEmail });
      if (!response.ok) {
        const retry = Number(response.headers.get("Retry-After"));
        if (response.status === 429 && retry) startResendCountdown(retry);
        setState("error", explain(response.status, payload.detail, t("auth.failed")));
        return;
      }
      setState("ok", t("auth.codeResent"));
      startResendCountdown(60);
    } catch (err) {
      setState("error", t("common.couldNotReach"));
    }
  });

  $("verify-back").addEventListener("click", () => {
    clearInterval(resendTimer);
    setState("", "");
    showStep("credentials");
  });

  // ---------- Sign in with Google ----------
  async function onGoogleCredential(result) {
    try {
      const { response, payload } = await post("/auth/google", { credential: result.credential, language: lang });
      if (!response.ok) {
        setState("error", explain(response.status, payload.detail, t("auth.googleFailed")));
        return;
      }
      if (payload.status === "signed_in") {
        window.location.href = "/";
        return;
      }
      goToVerify(payload.email);
    } catch (err) {
      setState("error", t("common.couldNotReach"));
    }
  }

  function renderGoogleButton() {
    if (!googleClientId || !window.google || !google.accounts || !google.accounts.id) return;
    const holder = $("google-button");
    holder.innerHTML = "";
    const width = Math.min(Math.max(holder.clientWidth || 360, 200), 400);
    google.accounts.id.renderButton(holder, {
      theme: "outline",
      size: "large",
      shape: "rectangular",
      text: "continue_with",
      logo_alignment: "left",
      width,
      locale: lang,
    });
  }

  async function setUpGoogle() {
    try {
      const response = await fetch("/auth/config");
      if (!response.ok) return;
      googleClientId = (await response.json()).google_client_id;
    } catch (err) {
      return;
    }
    if (!googleClientId) return;
    $("google-block").hidden = false;
    const script = document.createElement("script");
    script.src = "https://accounts.google.com/gsi/client";
    script.async = true;
    script.defer = true;
    script.onload = () => {
      google.accounts.id.initialize({
        client_id: googleClientId,
        callback: onGoogleCredential,
        ux_mode: "popup",
        context: "signin",
      });
      renderGoogleButton();
    };
    script.onerror = () => { $("google-block").hidden = true; };
    document.head.appendChild(script);
  }

  applyStaticTranslations();
  setUpGoogle();

  (async () => {
    try {
      const response = await fetch("/auth/me");
      const payload = await response.json();
      if (response.ok && payload.user) window.location.href = "/";
    } catch (err) {
      // Stay on the sign-in page if the check fails.
    }
  })();
</script>
</body>
</html>
