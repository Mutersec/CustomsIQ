<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — CustomsIQ</title>
<meta name="description" content="CustomsIQ — EU customs classification, sanctions screening and duty calculation. Sign in to continue.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
:root {
  --navy: #0b2545;
  --navy-2: #13315c;
  --gold: #c9a227;
  --gold-soft: #f4e6b5;
  --ink: #0f1b2d;
  --ink-dim: #4d5b70;
  --glass: rgba(255, 255, 255, 0.82);
  --glass-border: rgba(255, 255, 255, 0.55);
  --line: #d7dde6;
  --field: #ffffff;
  --red: #b3261e;
  --red-soft: #fdecea;
  --green: #1e7d4f;
  --green-soft: #e6f4ec;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--ink);
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  /* The scene is the page: no solid backdrop around the card. */
  background: #081a31 url("/static/harbor-scene.svg") center / cover no-repeat fixed;
}

/* A soft vignette keeps the card and header legible over any part of the scene. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(5, 18, 38, 0.55) 0%, rgba(5, 18, 38, 0.05) 30%, rgba(5, 18, 38, 0.15) 70%, rgba(5, 18, 38, 0.6) 100%);
  pointer-events: none;
  z-index: 0;
}

header, main, footer { position: relative; z-index: 1; }

/* ---------- header ---------- */
.header-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
  text-decoration: none;
  min-width: 0;
}
.brand-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.1;
}
.brand-name .accent { color: var(--gold); }
.brand-sub {
  display: block;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.78);
}

.lang-switch {
  display: inline-flex;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 999px;
  overflow: hidden;
  background: rgba(8, 26, 49, 0.35);
  backdrop-filter: blur(6px);
}
.lang-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: #fff;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.6px;
  padding: 6px 13px;
  cursor: pointer;
}
.lang-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.14); }
.lang-btn.active { background: var(--gold); color: var(--navy); }
.lang-btn:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }

/* ---------- card ---------- */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 40px;
}

.card {
  width: 100%;
  max-width: 440px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(3, 12, 28, 0.45);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  overflow: hidden;
}

.card-head {
  padding: 22px 26px 6px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--navy-2);
}
.eyebrow::before {
  content: "";
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: var(--gold);
}
.card h1 {
  margin: 6px 0 4px;
  font-size: 23px;
  line-height: 1.25;
  color: var(--navy);
  overflow-wrap: anywhere;
}
.card .lead {
  margin: 0;
  color: var(--ink-dim);
  font-size: 14px;
  overflow-wrap: anywhere;
}

.card-body { padding: 16px 26px 24px; }

.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 10px;
  background: rgba(11, 37, 69, 0.08);
  margin-bottom: 18px;
}
.tab {
  flex: 1 1 0;
  min-width: 0;
  appearance: none;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-dim);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 9px 8px;
  cursor: pointer;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.tab.active { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(11, 37, 69, 0.18); }
.tab:focus-visible { outline: 2px solid var(--navy-2); outline-offset: 1px; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: var(--navy-2);
  margin-bottom: 5px;
}
.field input {
  width: 100%;
  font: inherit;
  font-size: 15px;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--field);
  color: var(--ink);
}
.field input:focus { outline: none; border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(19, 49, 92, 0.18); }
.field input.code {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 12px;
  text-align: center;
  padding: 10px;
  font-variant-numeric: tabular-nums;
}

.btn {
  width: 100%;
  appearance: none;
  border: 0;
  border-radius: 9px;
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.25;
  padding: 12px 16px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--navy-2); }
.btn-link {
  width: auto;
  background: transparent;
  color: var(--navy-2);
  padding: 6px 4px;
  font-size: 13.5px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 14px;
  color: var(--ink-dim);
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

#google-button { display: flex; justify-content: center; min-height: 44px; }

.verify-note {
  margin: 0 0 14px;
  padding: 12px 14px;
  border-radius: 9px;
  background: var(--gold-soft);
  color: var(--ink);
  font-size: 14px;
  overflow-wrap: anywhere;
}
.verify-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 12px;
  margin-top: 8px;
}

.state {
  margin-top: 14px;
  padding: 10px 13px;
  border-radius: 9px;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.state.error { background: var(--red-soft); color: var(--red); }
.state.ok { background: var(--green-soft); color: var(--green); }

.secure {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 26px;
  border-top: 1px solid rgba(11, 37, 69, 0.08);
  background: rgba(11, 37, 69, 0.04);
  color: var(--ink-dim);
  font-size: 12.5px;
}
.secure svg { flex: none; }

[hidden] { display: none !important; }

/* ---------- footer ---------- */
footer {
  padding: 0 20px 22px;
  text-align: center;
  color: rgba(255, 255, 255, 0.82);
  font-size: 12.5px;
}
footer p { max-width: 640px; margin: 0 auto; }

@media (max-width: 480px) {
  .brand-sub { display: none; }
  .card-head { padding: 18px 18px 4px; }
  .card-body { padding: 14px 18px 20px; }
  .secure { padding: 12px 18px; }
  .card h1 { font-size: 21px; }
}
/* =====================================================================
   Visual layer: split showcase, motion and depth. Presentation only; the
   sign-in form, its ids and its flow are untouched. All motion is dropped
   under prefers-reduced-motion.
   ===================================================================== */
:root { --gold-2: #e8c766; --sky: #5b8def; --ease: cubic-bezier(0.22, 1, 0.36, 1); }

body {
  font-family: "Inter", "SF Pro Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #081a31;
  overflow-x: hidden;
}
/* the scene drifts slowly behind everything (Ken Burns) */
.scene {
  position: fixed;
  inset: -5%;
  z-index: -2;
  background: url("/static/harbor-scene.svg") center / cover no-repeat;
  animation: kenburns 30s ease-in-out infinite alternate;
}
body::before {
  background:
    linear-gradient(90deg, rgba(5, 18, 38, 0.92) 0%, rgba(5, 18, 38, 0.7) 45%, rgba(5, 18, 38, 0.25) 100%),
    linear-gradient(180deg, rgba(5, 18, 38, 0.5) 0%, transparent 30%, transparent 70%, rgba(5, 18, 38, 0.7) 100%);
}
.glow {
  position: fixed;
  z-index: 0;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  opacity: 0.5;
}
.glow.g1 { width: 560px; height: 560px; left: -180px; top: -200px; background: #1f4f8f; animation: drift 20s ease-in-out infinite alternate; }
.glow.g2 { width: 460px; height: 460px; right: -120px; bottom: -200px; background: rgba(201, 162, 39, 0.5); animation: drift 24s ease-in-out infinite alternate-reverse; }
.grid-lines {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 52px 52px;
  mask-image: radial-gradient(ellipse at 25% 45%, #000 15%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at 25% 45%, #000 15%, transparent 70%);
  animation: gridpan 32s linear infinite;
}

header { animation: fade 0.8s var(--ease) both; }
.brand-name { font-size: 22px; letter-spacing: -0.2px; }
.brand-name .accent {
  background: linear-gradient(100deg, var(--gold), var(--gold-2), var(--gold));
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: sheen 6s linear infinite;
}
.lang-btn { transition: background 0.25s var(--ease), color 0.25s var(--ease); }

/* ---- split layout ---- */
main {
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
  gap: 64px;
  padding: 32px 20px 48px;
  justify-content: space-between;
}
.showcase { flex: 1 1 520px; max-width: 580px; color: #ffffff; min-width: 0; }
.showcase > * { animation: rise 0.9s var(--ease) both; }
.showcase > :nth-child(2) { animation-delay: 0.08s; }
.showcase > :nth-child(3) { animation-delay: 0.16s; }
.showcase > :nth-child(4) { animation-delay: 0.24s; }
.showcase > :nth-child(5) { animation-delay: 0.32s; }
.show-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 12px;
  border-radius: 999px;
  background: rgba(201, 162, 39, 0.12);
  border: 1px solid rgba(201, 162, 39, 0.35);
  color: var(--gold-2);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
}
.show-eyebrow::before {
  content: "";
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold-2);
  animation: ping 2.2s ease-out infinite;
}
.show-title {
  margin: 20px 0 14px;
  font-size: clamp(30px, 4.2vw, 50px);
  line-height: 1.08;
  font-weight: 800;
  letter-spacing: -1px;
  overflow-wrap: anywhere;
  background: linear-gradient(100deg, #ffffff 0%, #ffffff 40%, var(--gold-2) 50%, #ffffff 60%, #ffffff 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rise 0.9s var(--ease) 0.08s both, sheen 7s linear 1.2s infinite;
}
.show-sub { margin: 0 0 28px; font-size: 16.5px; line-height: 1.6; color: rgba(255, 255, 255, 0.78); max-width: 520px; }
.features { list-style: none; margin: 0 0 30px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.features li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  transition: transform 0.3s var(--ease), background 0.3s var(--ease), border-color 0.3s var(--ease);
}
.features li:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.1); border-color: rgba(232, 199, 102, 0.4); }
.features .ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px; height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(232, 199, 102, 0.28), rgba(91, 141, 239, 0.22));
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: var(--gold-2);
}
.previews { display: flex; flex-wrap: wrap; gap: 10px; }
.preview {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--ink);
  font-size: 13px;
  box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.55);
  animation: float 6s ease-in-out infinite;
}
.preview:nth-child(2) { animation-delay: -2s; }
.preview:nth-child(3) { animation-delay: -4s; }
.preview b { font-family: "SF Mono", Menlo, Consolas, monospace; color: var(--navy); font-size: 12.5px; }
.preview .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--sky)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot, var(--sky)) 25%, transparent); }

/* ---- the sign-in card ---- */
.card {
  position: relative;
  flex: 0 1 440px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 22px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  animation: pop 0.9s var(--ease) 0.15s both;
  overflow: visible;
}
/* a thin light that travels around the card's edge */
.card::before {
  content: "";
  position: absolute;
  inset: -1.5px;
  padding: 1.5px;
  border-radius: 23px;
  pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  background: conic-gradient(from var(--angle, 0deg), transparent 0 70%, rgba(232, 199, 102, 0.9) 80%, rgba(91, 141, 239, 0.9) 90%, transparent 100%);
  animation: orbit 6s linear infinite;
}
.card-head { padding: 28px 30px 6px; }
.card h1 { font-size: 26px; letter-spacing: -0.4px; font-weight: 800; }
.card-body { padding: 18px 30px 26px; }
.secure { padding: 14px 30px; border-radius: 0 0 22px 22px; }
.tabs { border-radius: 12px; }
.tab { transition: background 0.25s var(--ease), color 0.25s var(--ease), box-shadow 0.25s var(--ease); border-radius: 9px; }
.tab:hover:not(.active) { color: var(--navy); }
.field input {
  border-radius: 12px;
  padding: 12px 14px;
  background: #fbfcfe;
  transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s var(--ease);
}
.field input:hover { border-color: #b9c4d6; }
.field input:focus { background: #ffffff; border-color: var(--sky); box-shadow: 0 0 0 4px rgba(91, 141, 239, 0.18); }
.btn { border-radius: 12px; transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease); }
.btn-primary {
  position: relative;
  overflow: hidden;
  padding: 13px 16px;
  background: linear-gradient(135deg, #13315c, #0b2545 60%, #081a31);
  box-shadow: 0 12px 26px -10px rgba(11, 37, 69, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: -60%;
  width: 40%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transform: skewX(-20deg);
  animation: shine 3.5s var(--ease) 1.5s infinite;
}
.btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #1a3f74, #0f2d55 60%, #0b2545); transform: translateY(-1px); box-shadow: 0 18px 32px -12px rgba(11, 37, 69, 0.75); }
.btn-primary:active:not(:disabled) { transform: scale(0.985); }
.state { animation: rise 0.4s var(--ease) both; }
#step-verify:not([hidden]), #step-credentials:not([hidden]) { animation: fade 0.45s var(--ease) both; }

footer { animation: fade 1s var(--ease) 0.5s both; color: rgba(255, 255, 255, 0.7); }

@media (max-width: 960px) {
  main { flex-direction: column; gap: 36px; padding-top: 16px; }
  .showcase { flex: none; max-width: 640px; text-align: center; }
  .show-sub { margin-left: auto; margin-right: auto; }
  .features { text-align: left; }
  .previews { justify-content: center; }
  .card { flex: none; width: 100%; max-width: 440px; }
}
@media (max-width: 560px) {
  .features, .previews { display: none; }
  .show-title { font-size: 28px; margin-top: 14px; }
  .show-sub { margin-bottom: 0; font-size: 15px; }
  .card-head { padding: 20px 20px 4px; }
  .card-body { padding: 14px 20px 22px; }
  .secure { padding: 12px 20px; }
}

@property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes orbit { to { --angle: 360deg; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes sheen { from { background-position: 200% 0; } to { background-position: -50% 0; } }
@keyframes shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(90px, 60px) scale(1.15); } }
@keyframes gridpan { from { background-position: 0 0, 0 0; } to { background-position: 52px 52px, 52px 52px; } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(232, 199, 102, 0.7); } 100% { box-shadow: 0 0 0 10px rgba(232, 199, 102, 0); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="/login" aria-label="CustomsIQ">
      <span>
        <span class="brand-name">Customs<span class="accent">IQ</span></span>
        <span class="brand-sub" data-i18n="brandSub"></span>
      </span>
    </a>
    <span class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="tr">TR</button>
      <button type="button" class="lang-btn" data-lang="de">DE</button>
    </span>
  </div>
</header>

<div class="scene" aria-hidden="true"></div>
<div class="glow g1" aria-hidden="true"></div>
<div class="glow g2" aria-hidden="true"></div>
<div class="grid-lines" aria-hidden="true"></div>

<main>
  <section class="showcase">
    <span class="show-eyebrow" data-i18n="show.eyebrow"></span>
    <h2 class="show-title" data-i18n="show.title"></h2>
    <p class="show-sub" data-i18n="show.subtitle"></p>
    <ul class="features">
        <li><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg></span><span data-i18n="show.f1"></span></li>

  function detectLang() {
    let stored = null;
    try { stored = localStorage.getItem("customsiq_lang"); } catch (err) { /* private mode */ }
    if (stored && STRINGS[stored]) return stored;
    const browser = (navigator.language || "en").slice(0, 2);
    return STRINGS[browser] ? browser : "en";
  }

  let lang = detectLang();
  let authMode = "login";
  let step = "credentials";
  let pendingEmail = "";
  let resendTimer = null;
  let googleClientId = null;

  function t(key) {
    const parts = key.split(".");
    let value = STRINGS[lang];
    for (const part of parts) value = value ? value[part] : undefined;
    if (value === undefined) {
      value = STRINGS.en;
      for (const part of parts) value = value ? value[part] : undefined;
    }
    return value;
  }

  const $ = (id) => document.getElementById(id);
  const results = $("auth-results");
  const usernameInput = $("auth-username-input");
  const emailInput = $("auth-email-input");
  const passwordInput = $("auth-password-input");
  const codeInput = $("verify-code-input");

  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));

  function setState(cls, message) {
    results.innerHTML = message ? `<div class="state ${cls}">${escapeHtml(message)}</div>` : "";
  }

  function renderHeading() {
    const title = step === "verify" ? "auth.verifyTitle"
      : authMode === "register" ? "auth.registerTitle" : "auth.title";
    $("card-title").textContent = t(title);
    $("card-lead").textContent = step === "verify" ? ""
      : t(authMode === "register" ? "auth.registerHint" : "auth.hint");
    $("card-lead").hidden = step === "verify";
    if (step === "verify") $("verify-note").textContent = t("auth.codeSentTo")(pendingEmail);
  }

  function applyStaticTranslations() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const value = t(el.dataset.i18n);
      if (typeof value === "string") el.textContent = value;
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
    setAuthMode(authMode);
    renderHeading();
    renderGoogleButton();
  }

  function setAuthMode(mode) {
    authMode = mode;
    const register = mode === "register";
    document.querySelectorAll(".tab").forEach((tab) => {
      const active = tab.dataset.mode === mode;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
    });
    $("email-field").hidden = !register;
    $("auth-username-label").textContent = t(register ? "auth.username" : "auth.usernameOrEmail");
    usernameInput.placeholder = t(register ? "auth.usernamePlaceholder" : "auth.usernameOrEmailPlaceholder");
    $("auth-submit").textContent = t(register ? "auth.registerTab" : "auth.loginTab");
    passwordInput.autocomplete = register ? "new-password" : "current-password";
    renderHeading();
  }

  function showStep(next) {
    step = next;
    $("step-credentials").hidden = next !== "credentials";
    $("step-verify").hidden = next !== "verify";
    renderHeading();
    if (next === "verify") {
      codeInput.value = "";
      codeInput.focus();
    }
  }

  // The server's error text is English; map it to the visitor's language.
  function explain(status, detail, fallback) {
    const text = String(detail || "").toLowerCase();
    if (status === 429 && text.includes("wait")) {
      const seconds = (text.match(/(\d+)/) || [])[1] || "60";
      return t("auth.tooSoon")(seconds);
    }
    if (status === 429) return t("auth.tooMany");
    if (status === 503 || status === 502) return t("auth.mailOff");
    if (text.includes("already taken")) return t("auth.taken");
    if (text.includes("already exists")) return t("auth.emailExists");
    if (text.includes("e-mail")) return t("auth.badEmail");
    if (text.includes("password must")) return t("auth.weakPassword");
    if (text.includes("username")) return t("auth.badUsername");
    if (text.includes("expired") || text.includes("too many") || text.includes("start again")) return t("auth.restart");
    if (text.includes("not correct")) return t("auth.badCode");
    return fallback;
  }

  async function post(url, body) {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    let payload = {};
    try { payload = await response.json(); } catch (err) { /* empty body */ }
    return { response, payload };
  }

  function startResendCountdown(seconds) {
    const button = $("verify-resend");
    clearInterval(resendTimer);
    let left = seconds;
    const tick = () => {
      if (left <= 0) {
        clearInterval(resendTimer);
        button.disabled = false;
        button.textContent = t("auth.resend");
        return;
      }
      button.disabled = true;
      button.textContent = t("auth.resendIn")(left);
      left -= 1;
    };
    tick();
    resendTimer = setInterval(tick, 1000);
  }

  function goToVerify(email) {
    pendingEmail = email;
    setState("", "");
    showStep("verify");
    startResendCountdown(60);
  }

  document.querySelectorAll(".lang-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      lang = btn.dataset.lang;
      try { localStorage.setItem("customsiq_lang", lang); } catch (err) { /* private mode */ }
      applyStaticTranslations();
    });
  });

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      setState("", "");
      setAuthMode(tab.dataset.mode);
    });
  });

  $("auth-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const email = emailInput.value.trim();
    if (!username || !password || (authMode === "register" && !email)) {
      setState("error", t("common.enterValue"));
      return;
    }
    const submit = $("auth-submit");
    submit.disabled = true;
    try {
      if (authMode === "login") {
        const { response, payload } = await post("/auth/login", { username, password });
        if (!response.ok) {
          setState("error", response.status === 401 ? t("auth.badLogin") : explain(response.status, payload.detail, t("auth.failed")));
          return;
        }
        window.location.href = "/";
        return;
      }
      const { response, payload } = await post("/auth/register", { username, email, password, language: lang });
      if (!response.ok) {
        setState("error", explain(response.status, payload.detail, t("auth.failed")));
        return;
      }
      goToVerify(payload.email);
    } catch (err) {
      setState("error", t("common.couldNotReach"));
    } finally {
      submit.disabled = false;
    }
  });

  codeInput.addEventListener("input", () => {
    codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
  });

  $("verify-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const code = codeInput.value.trim();
    if (code.length !== 6) {
      setState("error", t("auth.badCode"));
      return;
    }
    const submit = $("verify-submit");
    submit.disabled = true;
    try {
      const { response, payload } = await post("/auth/verify", { email: pendingEmail, code });
      if (!response.ok) {
        const message = explain(response.status, payload.detail, t("auth.badCode"));
        setState("error", message);
        if (message === t("auth.restart")) setTimeout(() => showStep("credentials"), 1800);
        return;
      }
      window.location.href = "/";
    } catch (err) {
      setState("error", t("common.couldNotReach"));
    } finally {
      submit.disabled = false;
    }
  });

  $("verify-resend").addEventListener("click", async () => {
    try {
      const { response, payload } = await post("/auth/resend", { email: pendingEmail });
      if (!response.ok) {
        const retry = Number(response.headers.get("Retry-After"));
        if (response.status === 429 && retry) startResendCountdown(retry);
        setState("error", explain(response.status, payload.detail, t("auth.failed")));
        return;
      }
      setState("ok", t("auth.codeResent"));
      startResendCountdown(60);
    } catch (err) {
      setState("error", t("common.couldNotReach"));
    }
  });

  $("verify-back").addEventListener("click", () => {
    clearInterval(resendTimer);
    setState("", "");
    showStep("credentials");
  });

  // ---------- Sign in with Google ----------
  async function onGoogleCredential(result) {
    try {
      const { response, payload } = await post("/auth/google", { credential: result.credential, language: lang });
      if (!response.ok) {
        setState("error", explain(response.status, payload.detail, t("auth.googleFailed")));
        return;
      }
      if (payload.status === "signed_in") {
        window.location.href = "/";
        return;
      }
      goToVerify(payload.email);
    } catch (err) {
      setState("error", t("common.couldNotReach"));
    }
  }

  function renderGoogleButton() {
    if (!googleClientId || !window.google || !google.accounts || !google.accounts.id) return;
    const holder = $("google-button");
    holder.innerHTML = "";
    const width = Math.min(Math.max(holder.clientWidth || 360, 200), 400);
    google.accounts.id.renderButton(holder, {
      theme: "outline",
      size: "large",
      shape: "rectangular",
      text: "continue_with",
      logo_alignment: "left",
      width,
      locale: lang,
    });
  }

  async function setUpGoogle() {
    try {
      const response = await fetch("/auth/config");
      if (!response.ok) return;
      googleClientId = (await response.json()).google_client_id;
    } catch (err) {
      return;
    }
    if (!googleClientId) return;
    $("google-block").hidden = false;
    const script = document.createElement("script");
    script.src = "https://accounts.google.com/gsi/client";
    script.async = true;
    script.defer = true;
    script.onload = () => {
      google.accounts.id.initialize({
        client_id: googleClientId,
        callback: onGoogleCredential,
        ux_mode: "popup",
        context: "signin",
      });
      renderGoogleButton();
    };
    script.onerror = () => { $("google-block").hidden = true; };
    document.head.appendChild(script);
  }

  applyStaticTranslations();
  setUpGoogle();

  (async () => {
    try {
      const response = await fetch("/auth/me");
      const payload = await response.json();
      if (response.ok && payload.user) window.location.href = "/";
    } catch (err) {
      // Stay on the sign-in page if the check fails.
    }
  })();
</script>
</body>
</html>
