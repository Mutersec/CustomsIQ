[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts prepend the repo root to sys.path before importing src.*
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# openpyxl is an optional, lazily-imported extra for Excel input; it ships no stubs.
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/customsiq", "scripts"]
omit = [
    "src/customsiq/cn_classifier.py",
    "src/customsiq/tariff_calculator.py",
]

[tool.coverage.report]
fail_under = 80
