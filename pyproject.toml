[project]
name = "customsiq"
version = "1.0.0"
description = "An EU trade-compliance toolkit — HS/CN classification, denied-party screening, duty calculation and composite risk scoring, on the real EU Combined Nomenclature."
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# B008 exists to catch a mutable default built once at import time, e.g. def f(x=[]).
# FastAPI's dependency injection is declared exactly that way on purpose —
# `user: User = Depends(current_user)` — and the object it builds is an immutable
# marker FastAPI resolves per request, so the warning doesn't apply here.
extend-immutable-calls = [
    "fastapi.Depends",
    "src.customsiq.api.require_permission",
]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts prepend the repo root to sys.path before importing src.*
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# openpyxl is an optional, lazily-imported extra for Excel input; it ships no stubs.
module = ["openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# psycopg is the optional, lazily-imported PostgreSQL driver (requirements-postgres.txt);
# a dev environment on the default SQLite backend won't have it installed.
module = ["psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a real PostgreSQL server (set CUSTOMSIQ_TEST_POSTGRES_URL); skipped otherwise",
]

[tool.coverage.run]
source = ["src/customsiq", "scripts"]

[tool.coverage.report]
fail_under = 80
